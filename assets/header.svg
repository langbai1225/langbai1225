<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Consolas, Menlo, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060c1e"/>
      <stop offset="0.5" stop-color="#02060e"/>
      <stop offset="1" stop-color="#040c1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5aa9ff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#5aa9ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#16385e"/>
      <stop offset="0.6" stop-color="#050e1c"/>
      <stop offset="1" stop-color="#02060f"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f2ff"/>
      <stop offset="1" stop-color="#7fbfff"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#5aa9ff" fill-opacity="0.08"/>
    </pattern>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 0 26" fill="none" stroke="#5aa9ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="950" cy="170" rx="330" ry="230" fill="url(#halo)"/>
  <rect width="1200" height="340" fill="url(#scan)"/>

  <!-- STARS -->
  <g fill="#a8d4ff" opacity="0.75">
    <circle cx="140" cy="42" r="1.2"/><circle cx="300" cy="24" r="1"/><circle cx="470" cy="60" r="1.3"/>
    <circle cx="620" cy="30" r="1"/><circle cx="760" cy="70" r="1.2"/><circle cx="1120" cy="46" r="1.1"/>
    <circle cx="1150" cy="290" r="1.2"/><circle cx="700" cy="300" r="1"/><circle cx="200" cy="300" r="1.1"/>
    <circle cx="560" cy="316" r="1.3"/><circle cx="860" cy="24" r="1"/><circle cx="60" cy="180" r="1"/>
  </g>

  <!-- CRT FRAME -->
  <rect x="14" y="14" width="1172" height="312" rx="10" fill="none" stroke="#5aa9ff" stroke-opacity="0.45" stroke-width="1.5"/>
  <g stroke="#5aa9ff" stroke-opacity="0.9" stroke-width="2.5" fill="none" filter="url(#softglow)">
    <path d="M14 62 L14 14 L62 14"/><path d="M1138 14 L1186 14 L1186 62"/>
    <path d="M1186 278 L1186 326 L1138 326"/><path d="M62 326 L14 326 L14 278"/>
  </g>
  <g fill="#5aa9ff" opacity="0.85">
    <rect x="34" y="26" width="7" height="7"/><rect x="46" y="26" width="7" height="7" opacity="0.5"/>
    <rect x="58" y="26" width="7" height="7" opacity="0.25"/>
  </g>
  <text x="76" y="33" fill="#5aa9ff" fill-opacity="0.55" font-size="11" letter-spacing="2">PROFILE://TERMINAL — SECURE CHANNEL</text>

  <!-- LEFT: ACCENT BAR -->
  <rect x="56" y="82" width="3" height="150" fill="#5aa9ff" opacity="0.85" filter="url(#glow)"/>

  <!-- LEFT: TITLE BLOCK -->
  <text x="76" y="104" fill="#5aa9ff" fill-opacity="0.8" font-size="13" letter-spacing="3">&gt;_ IDENTITY: OPERATOR</text>
  <text x="76" y="164" fill="url(#txt)" font-size="56" font-weight="bold" letter-spacing="5" filter="url(#glow)">langbai1225</text>
  <text x="78" y="192" fill="#5aa9ff" fill-opacity="0.62" font-size="14" letter-spacing="2">github.com/langbai1225</text>

  <!-- LEFT: BOOT LOG -->
  <g font-size="13" letter-spacing="1">
    <text x="76" y="222" fill="#3f9be8">&gt; establishing uplink ....... <tspan fill="#a8d4ff">[ OK ]</tspan></text>
    <text x="76" y="244" fill="#3f9be8">&gt; decrypting credentials ... <tspan fill="#a8d4ff">[ OK ]</tspan></text>
    <text x="76" y="266" fill="#3f9be8">&gt; scanning perimeter ........ <tspan fill="#a8d4ff">[ CLEAN ]</tspan></text>
    <text x="76" y="288" fill="#3f9be8">&gt; loading skill matrix ...... <tspan fill="#a8d4ff">[ DONE ]</tspan></text>
  </g>

  <!-- LEFT: CURSOR -->
  <text x="76" y="312" fill="#5aa9ff" font-size="14" letter-spacing="2">&gt; </text>
  <rect x="96" y="300" width="10" height="15" fill="#5aa9ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="116" y="312" fill="#5aa9ff" fill-opacity="0.45" font-size="12" letter-spacing="2">awaiting_command...</text>

  <!-- RIGHT: PLANET -->
  <g transform="translate(958,170)">
    <ellipse rx="215" ry="215" fill="url(#halo)"/>
    <g transform="rotate(-16)">
      <!-- rear ring -->
      <path d="M-134 0 A134 42 0 0 1 134 0" fill="none" stroke="#5aa9ff" stroke-opacity="0.55" stroke-width="2"/>
      <!-- planet body -->
      <circle r="78" fill="url(#core)" stroke="#5aa9ff" stroke-opacity="0.9" stroke-width="1.6" filter="url(#glow)"/>
      <g fill="none" stroke="#5aa9ff" stroke-opacity="0.34" stroke-width="1">
        <ellipse rx="78" ry="24"/>
        <ellipse rx="78" ry="50"/>
        <ellipse rx="26" ry="78"/>
        <ellipse rx="54" ry="78"/>
        <line x1="-78" y1="0" x2="78" y2="0"/>
      </g>
      <circle cx="-26" cy="-30" r="9" fill="#1b4a7a" opacity="0.8"/>
      <circle cx="22" cy="24" r="14" fill="#1b4a7a" opacity="0.6"/>
      <circle cx="34" cy="-42" r="6" fill="#1b4a7a" opacity="0.7"/>
      <!-- front ring -->
      <path d="M-134 0 A134 42 0 0 0 134 0" fill="none" stroke="#5aa9ff" stroke-opacity="0.9" stroke-width="2.2" filter="url(#glow)"/>
    </g>
    <!-- orbiters -->
    <circle cx="-150" cy="-58" r="3.2" fill="#a8d4ff" filter="url(#glow)"/>
    <circle cx="196" cy="96" r="2.4" fill="#a8d4ff" opacity="0.8"/>
  </g>

  <!-- RIGHT: READOUT -->
  <text x="1050" y="296" fill="#5aa9ff" fill-opacity="0.5" font-size="11" letter-spacing="2" text-anchor="middle">ORBITAL NODE 07</text>
  <text x="1050" y="44" fill="#5aa9ff" fill-opacity="0.5" font-size="11" letter-spacing="2" text-anchor="middle">SIGNAL  ▮▮▮▯ 66%</text>
</svg>
